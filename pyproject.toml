[project]
name = "video-downloader"
version = "0.1.0"
description = "Download videos from YouTube and 1,000+ sites as MP4 with sound (yt-dlp, with a desktop window)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "darkdetect>=0.8.0",
    "deno>=2.9.8",
    "imageio-ffmpeg>=0.8.1",
    "pywebview>=6.2.1",
    "yt-dlp[default]>=2026.10.26",
]
